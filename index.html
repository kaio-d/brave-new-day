<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spider-Man: Um Novo Dia - Lançamento 30/07. Em breve nos cinemas.">
  <title>Spider-Man: Um Novo Dia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="smooth-wrapper">
    <div id="smooth-content">
      <div class="hero-page">
        <!-- Background cinematográfico vermelho com Spider-Man swinging -->
        <div class="hero-bg" aria-hidden="true">
          <div class="hero-bg-image"></div>
          <div class="hero-bg-gradient"></div>
        </div>

        <!-- Palco com proporção travada para manter alinhamento milimétrico em qualquer resolução -->
        <div class="hero-stage">
          <div class="hero-card-wrapper">
            <!-- Canto Superior Esquerdo: Logos Spider + Marvel (confinado no recorte vermelho) -->
            <header class="corner-top-left">
              <div class="brand-logos">
                <img src="assets/logo-spider.svg" alt="Spider Logo" class="logo-spider" width="38" height="50">
                <img src="assets/logo-marvel.svg" alt="Marvel" class="logo-marvel" width="78" height="30">
              </div>
            </header>

            <!-- Canto Superior Direito: Trailer + Comprar Ingresso (confinado no recorte vermelho fora do SVG) -->
            <nav class="corner-top-right" aria-label="Navegação Principal">
              <a href="#trailer" class="nav-trailer">TRAILER</a>
              <a href="#comprar-ingresso" class="btn-ticket">COMPRAR INGRESSO</a>
            </nav>

            <!-- Card Central (com formato recortado do Subtract.svg) -->
            <main class="hero-card">
              <svg class="subtract-shape" viewBox="0 0 1856 1016" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                  <clipPath id="card-cutout-clip" clipPathUnits="userSpaceOnUse">
                    <path d="M1468 0C1500.58 0 1527 26.4152 1527 59V72C1527 104.585 1553.42 131 1586 131H1797C1829.58 131 1856 157.415 1856 190V957C1856 989.585 1829.58 1016 1797 1016H388C355.415 1016 329 989.585 329 957V944C329 911.415 302.585 885 270 885H59C26.4152 885 0 858.585 0 826V190C0 157.415 26.4152 131 59 131H270C302.585 131 329 104.585 329 72V59C329 26.4152 355.415 0 388 0H1468Z" />
                  </clipPath>
                </defs>
                <g clip-path="url(#card-cutout-clip)">
                  <!-- Fundo branco do card recortado que transiciona para o preto -->
                  <rect id="heroCardBg" x="0" y="0" width="1856" height="1016" fill="#FFFFFF" />
                  <!-- Foto de Tom Holland com proporção original (1920x1080) preservada e transição suave de 59 frames -->
                  <image id="heroFrameImg" href="assets/frames/ezgif-frame-001.jpg" x="-32" y="-32" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" />
                </g>
              </svg>

          <!-- Elementos de conteúdo alocados por cima do SVG -->
          <div class="card-content">
            <!-- Lado Esquerdo: Título e Subtítulo -->
            <section class="card-left-section" aria-label="Título do Filme">
              <img src="assets/titulo-spider-man.svg" alt="Spider-Man" class="title-spider-man">
              <h1 class="title-novo-dia">UM NOVO DIA</h1>
            </section>

            <!-- Lado Direito: Sinopse descritiva posicionada ao lado da foto sem encostar -->
            <section class="card-right-section" aria-label="Sinopse">
              <p class="movie-description">
                É um <strong>NOVO DIA</strong> para Peter Parker. Agora, ele combate o crime em tempo integral como Homem-Aranha em um mundo que não se lembra dele.
              </p>
            </section>

            <!-- Canto Inferior Direito: Selo circular interativo "Role a Página" -->
            <a href="#elenco" class="scroll-badge" aria-label="Role a página para ver o elenco">
              <div class="badge-rotator">
                <img src="assets/role-pagina.svg" alt="Role a página" class="badge-text">
              </div>
              <img src="assets/mao.svg" alt="Mão disparando teia" class="badge-hand">
            </a>
          </div>
        </main>

        <!-- Canto Inferior Esquerdo: Lançamento (confinado no recorte vermelho fora do SVG) -->
        <footer class="corner-bottom-left">
          <div class="release-container">
            <span class="release-label">LANÇAMENTO</span>
            <strong class="release-date">30/07</strong>
          </div>
        </footer>
      </div>
    </div>

    <!-- ========================================================================
         FASE 2: TRAILER EXPANSÍVEL (0x0 A 100vw x 100vh) & PLAYER CUSTOMIZADO
         ======================================================================== -->
    <div class="hero-trailer-container" id="trailer">
      <div class="trailer-wrapper">
        <video class="trailer-video" id="trailerVideo" src="assets/trailer.mp4" playsinline muted loop preload="auto"></video>

        <!-- Overlay central de play/pause ao clicar no vídeo -->
        <div class="trailer-overlay-play" id="trailerOverlayPlay" aria-hidden="true">
          <svg class="overlay-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>

        <!-- Barra de Controles Customizada do Player -->
        <div class="trailer-controls" id="trailerControls">
          <!-- Botão Play / Pause -->
          <button type="button" class="trailer-btn-control" id="trailerPlayBtn" aria-label="Reproduzir ou Pausar">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <!-- Barra de Progresso / Seeker com arraste e clique -->
          <div class="trailer-progress-container" id="trailerProgressContainer" role="slider" aria-label="Barra de progresso do trailer" tabindex="0">
            <div class="trailer-progress-bar" id="trailerProgressBar">
              <div class="trailer-progress-thumb"></div>
            </div>
          </div>

          <!-- Indicador de Tempo Atual e Duração -->
          <span class="trailer-time" id="trailerTime">0:00 / 0:00</span>

          <!-- Botão de Ativar/Desativar Som (Mute/Unmute) -->
          <button type="button" class="trailer-btn-control" id="trailerMuteBtn" aria-label="Ativar ou Desativar Áudio">
            <!-- Ícone Mudo -->
            <svg class="icon-volume-muted" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            <!-- Ícone Som Ativo -->
            <svg class="icon-volume-high" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================================================
       SEGUNDA SEÇÃO: ELENCO (ZENDAYA / MICHELLE MJ JONES)
       ======================================================================== -->
  <section class="cast-section" id="elenco" aria-label="Elenco do Filme">
    <div class="cast-stage">
      <div class="cast-wrapper">
        <!-- Coluna Esquerda: Informações e Menu do Elenco -->
        <div class="cast-sidebar">
          <span class="cast-title">ELENCO</span>

          <div class="cast-person-header">
            <h2 class="cast-actor-name" id="castActorName">Zendaya</h2>
            <p class="cast-character-name" id="castCharacterName">MICHELLE MJ JONES</p>
          </div>

          <!-- Indicador vertical do elenco com ícone de aranha no item ativo -->
          <nav class="cast-navigation" aria-label="Seletor de Personagens">
            <div class="cast-timeline">
              <div class="cast-timeline-track"></div>
              <div class="cast-marker" id="castMarker" aria-hidden="true">
                <img src="assets/logo-spider.svg" alt="" class="cast-marker-icon">
              </div>
            </div>
            <ul class="cast-menu" role="tablist">
              <li class="cast-menu-item" role="presentation">
                <button type="button" class="cast-menu-btn" role="tab" aria-selected="false" data-actor="Zendaya" data-role="MICHELLE MJ JONES">

              </li>
              <li class="cast-menu-item is-active" role="presentation">
                <button type="button" class="cast-menu-btn" role="tab" aria-selected="true" data-actor="Zendaya" data-role="MICHELLE MJ JONES">
                  MICHELLE MJ JONES
                </button>
              </li>
              <li class="cast-menu-item" role="presentation">
                <button type="button" class="cast-menu-btn" role="tab" aria-selected="false" data-actor="Zendaya" data-role="MICHELLE MJ JONES">
                  MICHELLE MJ JONES
                </button>
              </li>
              <li class="cast-menu-item" role="presentation">
                <button type="button" class="cast-menu-btn" role="tab" aria-selected="false" data-actor="Zendaya" data-role="MICHELLE MJ JONES">
                  MICHELLE MJ JONES
                </button>
              </li>
            </ul>
          </nav>
        </div>

        <!-- Coluna Direita: Imagem de Destaque -->
        <div class="cast-showcase">
          <div class="cast-image-container">
            <img src="assets/img25.webp" alt="Zendaya como Michelle MJ Jones" class="cast-image" id="castImage">
          </div>
        </div>
      </div>
    </div>
  </section>
    </div>

  <!-- ========================================================================
       BIBLIOTECAS GSAP: Core, ScrollTrigger, ScrollSmoother e SplitText
       ======================================================================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://assets.codepen.io/16327/ScrollSmoother.min.js"></script>
  <script src="https://assets.codepen.io/16327/SplitText3.min.js"></script>

  <!-- Script principal de animações de scroll cinematográfico -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Pré-carregamento imediato dos 59 frames na memória para renderização fluida
      const TOTAL_FRAMES = 59;
      const frameImages = [];
      for (let i = 1; i <= TOTAL_FRAMES; i++) {
        const img = new Image();
        const num = String(i).padStart(3, '0');
        img.src = `assets/frames/ezgif-frame-${num}.jpg`;
        if (img.decode) {
          img.decode().catch(() => {});
        }
        frameImages.push(img);
      }

      const heroFrameImg = document.getElementById('heroFrameImg');
      const heroCardBg = document.getElementById('heroCardBg');
      const movieDesc = document.querySelector('.movie-description');

      // 2. Registro de plugins do GSAP
      const plugins = [ScrollTrigger];
      if (typeof ScrollSmoother !== 'undefined') plugins.push(ScrollSmoother);
      if (typeof SplitText !== 'undefined') plugins.push(SplitText);
      gsap.registerPlugin(...plugins);

      // 3. ScrollSmoother para rolagem cinematográfica inercial
      let smoother = null;
      if (typeof ScrollSmoother !== 'undefined') {
        smoother = ScrollSmoother.create({
          wrapper: '#smooth-wrapper',
          content: '#smooth-content',
          smooth: 1.2,
          effects: true,
          normalizeScroll: false
        });
      }

      // Navegação suave ao clicar em âncoras (ex: #trailer, #elenco)
      document.querySelectorAll('a[href^="#"]').forEach((link) => {
        link.addEventListener('click', (e) => {
          const targetId = link.getAttribute('href');
          if (targetId && targetId !== '#') {
            if (targetId === '#trailer') {
              e.preventDefault();
              const st = heroTL.scrollTrigger;
              if (st) {
                const targetScroll = st.start + (st.end - st.start) * 0.92;
                if (smoother) {
                  smoother.scrollTo(targetScroll, true);
                } else {
                  window.scrollTo({ top: targetScroll, behavior: 'smooth' });
                }
              }
              return;
            }

            const targetEl = document.querySelector(targetId);
            if (targetEl) {
              e.preventDefault();
              if (smoother) {
                smoother.scrollTo(targetEl, true, 'top top');
              } else {
                targetEl.scrollIntoView({ behavior: 'smooth' });
              }
            }
          }
        });
      });

      // 4. Configuração do SplitText no parágrafo da sinopse
      let chars = [];
      if (typeof SplitText !== 'undefined') {
        const split = new SplitText(movieDesc, {
          type: 'words,chars',
          charsClass: 'char',
          wordsClass: 'word'
        });
        chars = split.chars;
      } else {
        // Fallback transparente e resiliente caso SplitText esteja offline
        function splitTextFallback(element) {
          const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);
          const createdChars = [];
          textNodes.forEach(node => {
            const text = node.nodeValue;
            if (!text.trim()) return;
            const fragment = document.createDocumentFragment();
            for (let ch of text) {
              if (ch === ' ') {
                fragment.appendChild(document.createTextNode(' '));
              } else {
                const charSpan = document.createElement('span');
                charSpan.className = 'char';
                charSpan.textContent = ch;
                createdChars.push(charSpan);
                fragment.appendChild(charSpan);
              }
            }
            node.parentNode.replaceChild(fragment, node);
          });
          return createdChars;
        }
        chars = splitTextFallback(movieDesc);
      }

      // Elementos do Trailer e Player Customizado
      const trailerContainer = document.getElementById('trailer');
      const trailerVideo = document.getElementById('trailerVideo');
      const trailerPlayBtn = document.getElementById('trailerPlayBtn');
      const trailerOverlayPlay = document.getElementById('trailerOverlayPlay');
      const iconPlay = trailerPlayBtn.querySelector('.icon-play');
      const iconPause = trailerPlayBtn.querySelector('.icon-pause');
      const trailerMuteBtn = document.getElementById('trailerMuteBtn');
      const iconMuted = trailerMuteBtn.querySelector('.icon-volume-muted');
      const iconHigh = trailerMuteBtn.querySelector('.icon-volume-high');
      const trailerProgressBar = document.getElementById('trailerProgressBar');
      const trailerProgressContainer = document.getElementById('trailerProgressContainer');
      const trailerTime = document.getElementById('trailerTime');
      const trailerControls = document.getElementById('trailerControls');

      // 5. Timeline GSAP com Hero Pinada (Fase 1: Simbionte + Fase 2: Trailer Expansível)
      const heroTL = gsap.timeline({
        scrollTrigger: {
          trigger: '.hero-page',
          start: 'top top',
          end: '+=5200',
          pin: true,
          scrub: 0.8,
          anticipatePin: 1
        }
      });

      // --- FASE 1: TRANSIÇÃO DO SIMBIONTE (0.0 até 1.0) ---
      // A. Sequência de frames: frame 0 a 58 com tamanho original 1920x1080 preservado
      const frameObj = { frame: 0 };
      heroTL.to(frameObj, {
        frame: 58,
        ease: 'none',
        duration: 1,
        onUpdate: () => {
          const idx = Math.min(58, Math.max(0, Math.round(frameObj.frame)));
          if (heroFrameImg && frameImages[idx] && frameImages[idx].src) {
            heroFrameImg.setAttribute('href', frameImages[idx].src);
          }
        }
      }, 0);

      // B. Transição de cor do fundo: branco (#FFFFFF) para preto (#000000)
      if (heroCardBg) {
        heroTL.to(heroCardBg, {
          attr: { fill: '#000000' },
          ease: 'power1.inOut',
          duration: 0.85
        }, 0.08);
      }

      // Ambiência escura cinematográfica ao fundo
      heroTL.to('.hero-bg', {
        backgroundColor: '#0d0000',
        ease: 'none',
        duration: 0.85
      }, 0.08);

      // Transição da cor do parágrafo: começa preto (#000000) e altera para branco (#FFFFFF)
      // mesclando o tom sempre em oposição direta ao fundo
      heroTL.fromTo(movieDesc,
        { color: '#000000' },
        {
          color: '#FFFFFF',
          ease: 'power1.inOut',
          duration: 0.85
        },
        0.08
      );

      // C. Surgimento aleatório dos caracteres do parágrafo via SplitText
      // O parágrafo começa preto e, durante a troca para o fundo preto, os caracteres surgem de forma aleatória em branco
      if (chars.length > 0) {
        // Inicialmente visível em preto (#000000) sobre o card branco.
        // Ao iniciar a transição, os caracteres pretos se desfazem sutilmente:
        heroTL.to(chars, {
          opacity: 0,
          y: -6,
          filter: 'blur(3px)',
          stagger: {
            from: 'random',
            amount: 0.1
          },
          duration: 0.12,
          ease: 'power1.in'
        }, 0.05);

        // Durante a troca, surgem de forma aleatória na cor branca (#FFFFFF) conforme o preto toma conta:
        heroTL.fromTo(chars,
          {
            opacity: 0,
            y: 12,
            scale: 0.75,
            filter: 'blur(4px)',
            color: '#FFFFFF'
          },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            filter: 'blur(0px)',
            color: '#FFFFFF',
            stagger: {
              from: 'random',
              amount: 0.55
            },
            ease: 'power2.out',
            duration: 0.65
          },
          0.20
        );
      }

      // D. Adaptação do selo giratório "Role a página"
      heroTL.to('.badge-text', {
        filter: 'invert(0) contrast(1)',
        ease: 'power1.inOut',
        duration: 0.8
      }, 0.15);

      // --- FASE 2: TRAILER EXPANSÍVEL & REPRODUÇÃO MUTADA (1.15 até 2.0) ---
      // "ao finalizarmos a primeira transção, iremos carregar exibir um trailer que estará rolando, mutado.
      // ele deverá iniciar com um tamanho e altura de zero e conforme o usuário vai rolando ele vai aumentando de tamanho,
      // ocupando a largura e altura total da página"
      heroTL.fromTo(trailerContainer,
        {
          width: '0vw',
          height: '0vh',
          borderRadius: '48px',
          opacity: 0
        },
        {
          width: '100vw',
          height: '100vh',
          borderRadius: '0px',
          opacity: 1,
          ease: 'power2.inOut',
          duration: 0.85,
          onStart: () => {
            trailerContainer.classList.add('is-active');
            if (trailerVideo.paused) {
              trailerVideo.muted = true;
              trailerVideo.play().catch(() => {});
            }
          },
          onReverseComplete: () => {
            trailerContainer.classList.remove('is-active');
            trailerVideo.pause();
          }
        },
        1.15
      );

      // Manter a experiência do trailer em tela cheia disponível para interação
      heroTL.to({}, { duration: 0.25 }, 2.0);

      // --- LÓGICA DO PLAYER CUSTOMIZADO (PLAY/PAUSE, PROGRESSO, SOM) ---
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      function updatePlayState(isPlaying) {
        if (isPlaying) {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          trailerOverlayPlay.classList.remove('is-visible');
        } else {
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
          trailerOverlayPlay.classList.add('is-visible');
        }
      }

      function togglePlay() {
        if (trailerVideo.paused) {
          trailerVideo.play().then(() => updatePlayState(true)).catch(() => {});
        } else {
          trailerVideo.pause();
          updatePlayState(false);
        }
      }

      if (trailerPlayBtn && trailerVideo) {
        trailerPlayBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePlay();
        });

        trailerVideo.addEventListener('click', () => {
          togglePlay();
        });

        // Atualização contínua da barra de progresso e tempo
        let isDraggingProgress = false;

        trailerVideo.addEventListener('timeupdate', () => {
          if (!isDraggingProgress && trailerVideo.duration) {
            const pct = (trailerVideo.currentTime / trailerVideo.duration) * 100;
            trailerProgressBar.style.width = `${pct}%`;
            trailerTime.textContent = `${formatTime(trailerVideo.currentTime)} / ${formatTime(trailerVideo.duration)}`;
          }
        });

        trailerVideo.addEventListener('loadedmetadata', () => {
          trailerTime.textContent = `0:00 / ${formatTime(trailerVideo.duration)}`;
        });

        trailerVideo.addEventListener('play', () => updatePlayState(true));
        trailerVideo.addEventListener('pause', () => updatePlayState(false));

        // Controle de Áudio / Mudo
        if (trailerMuteBtn) {
          trailerMuteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            trailerVideo.muted = !trailerVideo.muted;
            if (trailerVideo.muted) {
              iconMuted.style.display = 'block';
              iconHigh.style.display = 'none';
            } else {
              iconMuted.style.display = 'none';
              iconHigh.style.display = 'block';
            }
          });
        }

        // Navegação (Seek) na barra de progresso por clique ou arraste
        function seekFromEvent(e) {
          const rect = trailerProgressContainer.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const clickX = Math.max(0, Math.min(clientX - rect.left, rect.width));
          const pct = clickX / rect.width;
          trailerProgressBar.style.width = `${pct * 100}%`;
          if (trailerVideo.duration) {
            trailerVideo.currentTime = pct * trailerVideo.duration;
            trailerTime.textContent = `${formatTime(trailerVideo.currentTime)} / ${formatTime(trailerVideo.duration)}`;
          }
        }

        trailerProgressContainer.addEventListener('mousedown', (e) => {
          isDraggingProgress = true;
          trailerProgressContainer.classList.add('is-dragging');
          seekFromEvent(e);
        });

        window.addEventListener('mousemove', (e) => {
          if (isDraggingProgress) {
            seekFromEvent(e);
          }
        });

        window.addEventListener('mouseup', () => {
          if (isDraggingProgress) {
            isDraggingProgress = false;
            trailerProgressContainer.classList.remove('is-dragging');
          }
        });

        // Suporte a Touch
        trailerProgressContainer.addEventListener('touchstart', (e) => {
          isDraggingProgress = true;
          trailerProgressContainer.classList.add('is-dragging');
          seekFromEvent(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (isDraggingProgress) {
            seekFromEvent(e);
          }
        }, { passive: true });

        window.addEventListener('touchend', () => {
          if (isDraggingProgress) {
            isDraggingProgress = false;
            trailerProgressContainer.classList.remove('is-dragging');
          }
        });

        // Auto-ocultar controles após 3s sem movimento
        let hideControlsTimeout;
        function resetControlsTimer() {
          trailerControls.classList.remove('is-hidden');
          clearTimeout(hideControlsTimeout);
          if (!trailerVideo.paused) {
            hideControlsTimeout = setTimeout(() => {
              trailerControls.classList.add('is-hidden');
            }, 3000);
          }
        }

        trailerContainer.addEventListener('mousemove', resetControlsTimer);
        trailerContainer.addEventListener('mouseleave', () => {
          if (!trailerVideo.paused) {
            trailerControls.classList.add('is-hidden');
          }
        });
      }
    });
  </script>

  <!-- Script leve para interatividade do seletor de elenco -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('.cast-menu-item');
      const marker = document.getElementById('castMarker');
      const timeline = document.querySelector('.cast-timeline');
      const actorEl = document.getElementById('castActorName');
      const roleEl = document.getElementById('castCharacterName');

      function updateMarker(activeItem) {
        if (!marker || !timeline || !activeItem) return;
        const timelineRect = timeline.getBoundingClientRect();
        const itemRect = activeItem.getBoundingClientRect();
        const relativeTop = (itemRect.top - timelineRect.top) + (itemRect.height / 2);
        marker.style.top = `${relativeTop}px`;
      }

      const currentActive = document.querySelector('.cast-menu-item.is-active');
      if (currentActive) {
        updateMarker(currentActive);
      }

      window.addEventListener('resize', () => {
        const active = document.querySelector('.cast-menu-item.is-active');
        if (active) updateMarker(active);
      });

      items.forEach((item) => {
        const btn = item.querySelector('.cast-menu-btn');
        btn.addEventListener('click', () => {
          items.forEach(i => {
            i.classList.remove('is-active');
            const b = i.querySelector('.cast-menu-btn');
            if (b) b.setAttribute('aria-selected', 'false');
          });

          item.classList.add('is-active');
          btn.setAttribute('aria-selected', 'true');
          updateMarker(item);

          const actor = btn.getAttribute('data-actor');
          const role = btn.getAttribute('data-role');
          if (actorEl && actor) actorEl.textContent = actor;
          if (roleEl && role) roleEl.textContent = role;
        });
      });
    });
  </script>
