<body>
  <div id="smooth-wrapper">

          <div class="hero-bg-image"></div>
          <div class="hero-bg-gradient"></div>
        </div>

        <!-- Palco com proporção travada para manter alinhamento milimétrico em qualquer resolução -->
        <div class="hero-stage">

                  <clipPath id="card-cutout-clip" clipPathUnits="userSpaceOnUse">

            </svg>
            <svg class="icon-volume-high" viewBox="0 0 24 24" fill="currentColor" style="display: none;">

            </svg>

  <!-- ========================================================================
       BIBLIOTECAS GSAP: Core, ScrollTrigger, ScrollSmoother e SplitText
       ======================================================================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://assets.codepen.io/16327/ScrollSmoother.min.js"></script>
  <script src="https://assets.codepen.io/16327/SplitText3.min.js"></script>

  <!-- Script principal de animações de scroll cinematográfico -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Pré-carregamento imediato dos 59 frames na memória para renderização fluida
      const TOTAL_FRAMES = 59;
      const frameImages = [];
      for (let i = 1; i <= TOTAL_FRAMES; i++) {
        const img = new Image();
        const num = String(i).padStart(3, '0');
        img.src = `assets/frames/ezgif-frame-${num}.jpg`;
        if (img.decode) {
          img.decode().catch(() => {});
        }
        frameImages.push(img);
      }

      const heroFrameImg = document.getElementById('heroFrameImg');
      const heroCardBg = document.getElementById('heroCardBg');
      const movieDesc = document.querySelector('.movie-description');

      // 2. Registro de plugins do GSAP
      const plugins = [ScrollTrigger];
      if (typeof ScrollSmoother !== 'undefined') plugins.push(ScrollSmoother);
      if (typeof SplitText !== 'undefined') plugins.push(SplitText);
      gsap.registerPlugin(...plugins);

      // 3. ScrollSmoother para rolagem cinematográfica inercial
      let smoother = null;
      if (typeof ScrollSmoother !== 'undefined') {
        smoother = ScrollSmoother.create({
          wrapper: '#smooth-wrapper',
          content: '#smooth-content',
          smooth: 1.2,
          effects: true,
          normalizeScroll: false
        });
      }

      // Navegação suave ao clicar em âncoras (ex: #elenco)
      document.querySelectorAll('a[href^="#"]').forEach((link) => {
        link.addEventListener('click', (e) => {
          const targetId = link.getAttribute('href');
          if (targetId && targetId !== '#') {
            const targetEl = document.querySelector(targetId);
            if (targetEl) {
              e.preventDefault();
              if (smoother) {
                smoother.scrollTo(targetEl, true, 'top top');
              } else {
                targetEl.scrollIntoView({ behavior: 'smooth' });
              }
            }
          }
        });
      });

      // 4. Configuração do SplitText no parágrafo da sinopse
      let chars = [];
      if (typeof SplitText !== 'undefined') {
        const split = new SplitText(movieDesc, {
          type: 'words,chars',
          charsClass: 'char',
          wordsClass: 'word'
        });
        chars = split.chars;
      } else {
        // Fallback transparente e resiliente caso SplitText esteja offline
        function splitTextFallback(element) {
          const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);
          const createdChars = [];
          textNodes.forEach(node => {
            const text = node.nodeValue;
            if (!text.trim()) return;
            const fragment = document.createDocumentFragment();
            for (let ch of text) {
              if (ch === ' ') {
                fragment.appendChild(document.createTextNode(' '));
              } else {
                const charSpan = document.createElement('span');
                charSpan.className = 'char';
                charSpan.textContent = ch;
                createdChars.push(charSpan);
                fragment.appendChild(charSpan);
              }
            }
            node.parentNode.replaceChild(fragment, node);
          });
          return createdChars;
        }
        chars = splitTextFallback(movieDesc);
      }

      // 5. Timeline GSAP com Hero Pinada (Fase 1: Simbionte/Frames + Fase 2: Trailer Expansível)
      const trailerVideo = document.getElementById('trailerVideo');
      const trailerContainer = document.getElementById('trailer');
      let userManuallyPaused = false;

      const heroTL = gsap.timeline({
        scrollTrigger: {
          trigger: '.hero-page',
          start: 'top top',
          end: '+=5400',
          pin: true,
          scrub: 0.8,
          anticipatePin: 1,
          onUpdate: (self) => {
            const p = self.progress;

            // Inicia o vídeo mutado quando a fase do trailer começa a surgir (~0.40 de progresso)
            if (p >= 0.40) {
              if (trailerVideo && trailerVideo.paused && !userManuallyPaused) {
                trailerVideo.muted = true;
                trailerVideo.play().catch(() => {});
              }
            } else {
              // Pausa caso o usuário role para trás voltando para a fase 1
              if (trailerVideo && !trailerVideo.paused) {
                trailerVideo.pause();
              }
            }

            // Habilita a interação com os controles do player quando o trailer estiver fullscreen
            if (trailerContainer) {
              if (p >= 0.72) {
                trailerContainer.classList.add('is-active');
              } else {
                trailerContainer.classList.remove('is-active');
              }
            }
          }
        }
      });

      // A. Sequência de frames: frame 0 a 58 com tamanho original 1920x1080 preservado
      const frameObj = { frame: 0 };
      heroTL.to(frameObj, {
        frame: 58,
        ease: 'none',
        duration: 1,
        onUpdate: () => {
          const idx = Math.min(58, Math.max(0, Math.round(frameObj.frame)));
          if (heroFrameImg && frameImages[idx] && frameImages[idx].src) {
            heroFrameImg.setAttribute('href', frameImages[idx].src);
          }
        }
      }, 0);

      // B. Transição de cor do fundo: branco (#FFFFFF) para preto (#000000)
      if (heroCardBg) {
        heroTL.to(heroCardBg, {
          attr: { fill: '#000000' },
          ease: 'power1.inOut',
          duration: 0.85
        }, 0.08);
      }

      // Ambiência escura cinematográfica ao fundo
      heroTL.to('.hero-bg', {
        backgroundColor: '#0d0000',
        ease: 'none',
        duration: 0.85
      }, 0.08);

      // Transição da cor do parágrafo: começa preto (#000000) e altera para branco (#FFFFFF)
      // mesclando o tom sempre em oposição direta ao fundo
      heroTL.fromTo(movieDesc,
        { color: '#000000' },
        {
          color: '#FFFFFF',
          ease: 'power1.inOut',
          duration: 0.85
        },
        0.08
      );

      // C. Surgimento aleatório dos caracteres do parágrafo via SplitText
      // O parágrafo começa preto e, durante a troca para o fundo preto, os caracteres surgem de forma aleatória em branco
      if (chars.length > 0) {
        // Inicialmente visível em preto (#000000) sobre o card branco.
        // Ao iniciar a transição, os caracteres pretos se desfazem sutilmente:
        heroTL.to(chars, {
          opacity: 0,
          y: -6,
          filter: 'blur(3px)',
          stagger: {
            from: 'random',
            amount: 0.1
          },
          duration: 0.12,
          ease: 'power1.in'
        }, 0.05);

        // Durante a troca, surgem de forma aleatória na cor branca (#FFFFFF) conforme o preto toma conta:
        heroTL.fromTo(chars,
          {
            opacity: 0,
            y: 12,
            scale: 0.75,
            filter: 'blur(4px)',
            color: '#FFFFFF'
          },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            filter: 'blur(0px)',
            color: '#FFFFFF',
            stagger: {
              from: 'random',
              amount: 0.55
            },
            ease: 'power2.out',
            duration: 0.65
          },
          0.20
        );
      }

      // D. Adaptação do selo giratório "Role a página"
      heroTL.to('.badge-text', {
        filter: 'invert(0) contrast(1)',
        ease: 'power1.inOut',
        duration: 0.8
      }, 0.15);

      // E. Fase 2: Expansão do Trailer de 0x0 para Fullscreen (100vw x 100vh)
      // Inicia em 1.15 (após a conclusão dos frames e do SplitText) até 2.15
      heroTL.fromTo('#trailer',
        {
          width: '0vw',
          height: '0vh',
          borderRadius: '48px',
          opacity: 0
        },
        {
          width: '100vw',
          height: '100vh',
          borderRadius: '0px',
          opacity: 1,
          ease: 'power2.inOut',
          duration: 1.0
        },
        1.15
      );

      // F. Período fixado (Hold) para exibição e interação com o player do trailer
      heroTL.to({}, { duration: 0.6 }, 2.15);

      // 6. Controles Interativos do Player Customizado de Vídeo
      const trailerPlayBtn = document.getElementById('trailerPlayBtn');
      const trailerOverlayPlay = document.getElementById('trailerOverlayPlay');
      const trailerProgressContainer = document.getElementById('trailerProgressContainer');
      const trailerProgressBar = document.getElementById('trailerProgressBar');
      const trailerTime = document.getElementById('trailerTime');
      const trailerVolumeBtn = document.getElementById('trailerVolumeBtn');
      const trailerControls = document.getElementById('trailerControls');

      let overlayTimeout = null;

      function updatePlayUI(isPlaying) {
        if (!trailerPlayBtn || !trailerOverlayPlay) return;
        const playIcon = trailerPlayBtn.querySelector('.icon-play');
        const pauseIcon = trailerPlayBtn.querySelector('.icon-pause');
        const overlayPlay = trailerOverlayPlay.querySelector('.icon-play');
        const overlayPause = trailerOverlayPlay.querySelector('.icon-pause');

        if (isPlaying) {
          if (playIcon) playIcon.style.display = 'none';
          if (pauseIcon) pauseIcon.style.display = 'block';
          if (overlayPlay) overlayPlay.style.display = 'none';
          if (overlayPause) overlayPause.style.display = 'block';
        } else {
          if (playIcon) playIcon.style.display = 'block';
          if (pauseIcon) pauseIcon.style.display = 'none';
          if (overlayPlay) overlayPlay.style.display = 'block';
          if (overlayPause) overlayPause.style.display = 'none';
        }
      }

      function showOverlayFeedback() {
        if (!trailerOverlayPlay) return;
        trailerOverlayPlay.classList.add('is-visible');
        clearTimeout(overlayTimeout);
        overlayTimeout = setTimeout(() => {
          trailerOverlayPlay.classList.remove('is-visible');
        }, 600);
      }

      function togglePlay() {
        if (!trailerVideo) return;
        if (trailerVideo.paused) {
          trailerVideo.play().then(() => {
            userManuallyPaused = false;
            updatePlayUI(true);
            showOverlayFeedback();
            resetControlsTimer();
          }).catch(() => {});
        } else {
          trailerVideo.pause();
          userManuallyPaused = true;
          updatePlayUI(false);
          showOverlayFeedback();
          if (trailerControls) trailerControls.classList.remove('is-hidden');
        }
      }

      if (trailerPlayBtn) {
        trailerPlayBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePlay();
        });
      }

      if (trailerVideo) {
        trailerVideo.addEventListener('click', () => {
          togglePlay();
        });

        trailerVideo.addEventListener('play', () => updatePlayUI(true));
        trailerVideo.addEventListener('pause', () => updatePlayUI(false));
      }

      // Formatação de tempo em M:SS
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      // Atualização contínua da barra de progresso e tempo
      let isDragging = false;

      function updateProgress() {
        if (!isDragging && trailerVideo && trailerVideo.duration) {
          const percent = (trailerVideo.currentTime / trailerVideo.duration) * 100;
          if (trailerProgressBar) trailerProgressBar.style.width = `${percent}%`;
          if (trailerTime) trailerTime.textContent = `${formatTime(trailerVideo.currentTime)} / ${formatTime(trailerVideo.duration)}`;
          if (trailerProgressContainer) trailerProgressContainer.setAttribute('aria-valuenow', Math.round(percent));
        }
      }

      if (trailerVideo) {
        trailerVideo.addEventListener('timeupdate', updateProgress);
        trailerVideo.addEventListener('loadedmetadata', () => {
          if (trailerTime) trailerTime.textContent = `0:00 / ${formatTime(trailerVideo.duration)}`;
        });
      }

      // Navegação pela barra de progresso (clique e arraste)
      function seek(e) {
        if (!trailerVideo || !trailerVideo.duration || !trailerProgressContainer) return;
        const rect = trailerProgressContainer.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        let pos = (clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        if (trailerProgressBar) trailerProgressBar.style.width = `${pos * 100}%`;
        trailerVideo.currentTime = pos * trailerVideo.duration;
        if (trailerTime) trailerTime.textContent = `${formatTime(trailerVideo.currentTime)} / ${formatTime(trailerVideo.duration)}`;
      }

      if (trailerProgressContainer) {
        trailerProgressContainer.addEventListener('mousedown', (e) => {
          isDragging = true;
          trailerProgressContainer.classList.add('is-dragging');
          seek(e);
        });

        trailerProgressContainer.addEventListener('touchstart', (e) => {
          isDragging = true;
          trailerProgressContainer.classList.add('is-dragging');
          seek(e);
        }, { passive: true });
      }

      window.addEventListener('mousemove', (e) => {
        if (isDragging) seek(e);
      });

      window.addEventListener('touchmove', (e) => {
        if (isDragging) seek(e);
      }, { passive: true });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          if (trailerProgressContainer) trailerProgressContainer.classList.remove('is-dragging');
        }
      });

      window.addEventListener('touchend', () => {
        if (isDragging) {
          isDragging = false;
          if (trailerProgressContainer) trailerProgressContainer.classList.remove('is-dragging');
        }
      });

      // Alternância de som (Mute / Unmute)
      if (trailerVolumeBtn && trailerVideo) {
        trailerVolumeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          trailerVideo.muted = !trailerVideo.muted;
          const mutedIcon = trailerVolumeBtn.querySelector('.icon-volume-muted');
          const highIcon = trailerVolumeBtn.querySelector('.icon-volume-high');
          if (trailerVideo.muted) {
            if (mutedIcon) mutedIcon.style.display = 'block';
            if (highIcon) highIcon.style.display = 'none';
          } else {
            if (mutedIcon) mutedIcon.style.display = 'none';
            if (highIcon) highIcon.style.display = 'block';
            if (trailerVideo.volume === 0) trailerVideo.volume = 1;
          }
        });
      }

      // Auto-ocultação dos controles após inatividade
      let controlsTimer = null;
      function resetControlsTimer() {
        if (!trailerControls) return;
        trailerControls.classList.remove('is-hidden');
        clearTimeout(controlsTimer);
        if (trailerVideo && !trailerVideo.paused) {
          controlsTimer = setTimeout(() => {
            trailerControls.classList.add('is-hidden');
          }, 2500);
        }
      }

      if (trailerContainer) {
        trailerContainer.addEventListener('mousemove', resetControlsTimer);
        trailerContainer.addEventListener('touchstart', resetControlsTimer, { passive: true });
      }

      // Atalho de rolagem para o link TRAILER do menu
      document.querySelectorAll('a[href="#trailer"]').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const st = heroTL.scrollTrigger;
          if (st) {
            const targetScroll = st.start + (st.end - st.start) * 0.82;
            if (smoother) {
              smoother.scrollTo(targetScroll, true);
            } else {
              window.scrollTo({ top: targetScroll, behavior: 'smooth' });
            }
          }
        });
      });
    });
  </script>

  <!-- Script leve para interatividade do seletor de elenco -->
  <!-- Script de animações de scroll da seção de Elenco com GSAP -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('.cast-menu-item');
      const marker = document.getElementById('castMarker');
      const timeline = document.querySelector('.cast-timeline');
      const actorEl = document.getElementById('castActorName');
      const roleEl = document.getElementById('castCharacterName');
      const castData = [
        { actor: 'Tom Holland', role: 'PETER PARKER' },
        { actor: 'Zendaya', role: 'MICHELLE MJ JONES' },
        { actor: 'Jacob Batalon', role: 'NED LEEDS' },
        { actor: 'Michael Mando', role: 'MAC GARGAN' },
        { actor: 'Mark Ruffalo', role: 'BRUCE BANNER' }
      ];

      function updateMarker(activeItem) {
        if (!marker || !timeline || !activeItem) return;
        const timelineRect = timeline.getBoundingClientRect();
        const itemRect = activeItem.getBoundingClientRect();
        const relativeTop = (itemRect.top - timelineRect.top) + (itemRect.height / 2);
        marker.style.top = `${relativeTop}px`;
      // Pré-carregamento imediato das imagens do elenco na memória
      const castImages = [
        'assets/elenco/img1.webp',
        'assets/elenco/img2.webp',
        'assets/elenco/img3.webp',
        'assets/elenco/img4.webp',
        'assets/elenco/img5.webp'
      ];
      castImages.forEach((src) => {
        const img = new Image();
        img.src = src;
        if (img.decode) img.decode().catch(() => {});
      });

      const castSlides = document.querySelectorAll('.cast-slide');
      const castMarker = document.getElementById('castMarker');
      const castTimelineFill = document.getElementById('castTimelineFill');
      const castTimeline = document.querySelector('.cast-timeline');
      const castMenuItems = document.querySelectorAll('.cast-menu-item');
      const castActorEl = document.getElementById('castActorName');
      const castRoleEl = document.getElementById('castCharacterName');

      // Configuração inicial de camadas dos slides:
      // Slide 0 visível (yPercent: 0), slides 1 a 4 posicionados acima (yPercent: -100)
      gsap.set(castSlides[0], { yPercent: 0 });
      for (let i = 1; i < castSlides.length; i++) {
        gsap.set(castSlides[i], { yPercent: -100 });
      }

      const currentActive = document.querySelector('.cast-menu-item.is-active');
      if (currentActive) {
        updateMarker(currentActive);
      function getMarkerPositions() {
        if (!castTimeline || castMenuItems.length === 0) return [];
        const tlRect = castTimeline.getBoundingClientRect();
        return Array.from(castMenuItems).map(item => {
          const r = item.getBoundingClientRect();
          return (r.top - tlRect.top) + (r.height / 2);
        });
      }

      let markerPositions = getMarkerPositions();
      if (markerPositions.length > 0) {
        gsap.set(castMarker, { top: `${markerPositions[0]}px` });
        gsap.set(castTimelineFill, { height: `${markerPositions[0]}px` });
      }

      // Função para alternar o ator e personagem ativos
      let currentCastIndex = 0;
      function updateCastInfo(index) {
        if (index === currentCastIndex) return;
        currentCastIndex = index;

        // Atualizar menu ativo
        castMenuItems.forEach((item, idx) => {
          const btn = item.querySelector('.cast-menu-btn');
          if (idx === index) {
            item.classList.add('is-active');
            if (btn) btn.setAttribute('aria-selected', 'true');
          } else {
            item.classList.remove('is-active');
            if (btn) btn.setAttribute('aria-selected', 'false');
          }
        });

        // Transição suave dos nomes de ator e personagem
        gsap.to([castActorEl, castRoleEl], {
          opacity: 0,
          y: -6,
          duration: 0.15,
          onComplete: () => {
            if (castData[index]) {
              castActorEl.textContent = castData[index].actor;
              castRoleEl.textContent = castData[index].role;
            }
            gsap.to([castActorEl, castRoleEl], {
              opacity: 1,
              y: 0,
              duration: 0.2
            });
          }
        });
      }

      // Timeline GSAP da Seção de Elenco Pinada
      const castTL = gsap.timeline({
        scrollTrigger: {
          trigger: '.cast-section',
          start: 'top top',
          end: '+=3600',
          pin: true,
          scrub: 0.8,
          anticipatePin: 1,
          invalidateOnRefresh: true,
          onUpdate: (self) => {
            const p = self.progress;
            let targetIdx = 0;
            if (p < 0.15) targetIdx = 0;
            else if (p < 0.38) targetIdx = 1;
            else if (p < 0.62) targetIdx = 2;
            else if (p < 0.85) targetIdx = 3;
            else targetIdx = 4;
            updateCastInfo(targetIdx);
          }
        }
      });

      // Recalcular posições no redimensionamento da janela
      window.addEventListener('resize', () => {
        const active = document.querySelector('.cast-menu-item.is-active');
        if (active) updateMarker(active);
        markerPositions = getMarkerPositions();
        if (markerPositions.length > currentCastIndex) {
          gsap.set(castMarker, { top: `${markerPositions[currentCastIndex]}px` });
          gsap.set(castTimelineFill, { height: `${markerPositions[currentCastIndex]}px` });
        }
        ScrollTrigger.refresh();
      });

      items.forEach((item) => {
      // Construção das 4 transições de slides (de cima para baixo: yPercent -100 -> 0)
      const initialHold = 0.5;
      const stepDuration = 1.0;
      const holdDuration = 0.5;

      // Posição inicial no tempo 0 da timeline
      castTL.set(castMarker, {
        top: () => `${getMarkerPositions()[0] || 0}px`
      }, 0);
      castTL.set(castTimelineFill, {
        height: () => `${getMarkerPositions()[0] || 0}px`
      }, 0);

      // Pausa inicial para o primeiro ator (Tom Holland / Peter Parker)
      castTL.to({}, { duration: initialHold }, 0);

      for (let i = 1; i < castSlides.length; i++) {
        const startTime = initialHold + (i - 1) * (stepDuration + holdDuration);

        // A imagem desce suavemente de cima para baixo
        castTL.fromTo(castSlides[i],
          { yPercent: -100 },
          { yPercent: 0, duration: stepDuration, ease: 'power1.inOut' },
          startTime
        );

        // A aranha desce até o item correspondente e a barra preenche a trilha
        castTL.to(castMarker, {
          top: () => `${getMarkerPositions()[i] || 0}px`,
          duration: stepDuration,
          ease: 'power1.inOut'
        }, startTime);

        castTL.to(castTimelineFill, {
          height: () => `${getMarkerPositions()[i] || 0}px`,
          duration: stepDuration,
          ease: 'power1.inOut'
        }, startTime);

        // Pausa para visualização de cada imagem
        castTL.to({}, { duration: holdDuration }, startTime + stepDuration);
      }

      // Clique nos botões do menu para rolar diretamente até o personagem
      castMenuItems.forEach((item, idx) => {
        const btn = item.querySelector('.cast-menu-btn');
        btn.addEventListener('click', () => {
          items.forEach(i => {
            i.classList.remove('is-active');
            const b = i.querySelector('.cast-menu-btn');
            if (b) b.setAttribute('aria-selected', 'false');
        if (btn) {
          btn.addEventListener('click', () => {
            const st = castTL.scrollTrigger;
            if (st) {
              const progressMap = [0.038, 0.269, 0.50, 0.731, 0.962];
              const targetScroll = st.start + (st.end - st.start) * progressMap[idx];
              const smoother = typeof ScrollSmoother !== 'undefined' ? ScrollSmoother.get() : null;
              if (smoother) {
                smoother.scrollTo(targetScroll, true);
              } else {
                window.scrollTo({ top: targetScroll, behavior: 'smooth' });
              }
            }
          });

          item.classList.add('is-active');
          btn.setAttribute('aria-selected', 'true');
          updateMarker(item);

          const actor = btn.getAttribute('data-actor');
          const role = btn.getAttribute('data-role');
          if (actorEl && actor) actorEl.textContent = actor;
          if (roleEl && role) roleEl.textContent = role;
        });
        }
      });
    });
  </script>
